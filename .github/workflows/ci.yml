name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  control-plane:
    name: Rust control plane + workspace contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the full Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validator
        run: python -m pip install "jsonschema[format]>=4.20,<5"
      - name: Check formatting
        run: cargo fmt --manifest-path services/designstudio-agentd/Cargo.toml -- --check
      - name: Test control plane
        run: cargo test --locked --all-targets --manifest-path services/designstudio-agentd/Cargo.toml
      - name: Test real stdio supervision protocol
        run: |
          cargo build --locked --manifest-path services/designstudio-agentd/Cargo.toml
          python services/designstudio-agentd/test_stdio_protocol.py \
            services/designstudio-agentd/target/debug/designstudio-agentd
      - name: Test workspace contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python services/designstudio-agentd/run_contract_tests.py
      - name: Enforce reference provenance boundary
        run: python tools/check_reference_provenance.py
      - name: Validate pinned FreeCAD distribution metadata
        run: |
          bash -n scripts/build-freecad.sh scripts/designstudio-launcher
          jq -e '
            .version == "1.1.1" and
            .commit == "0108fd4b4850cc46e625b60e53cea7a7bbe69f8d" and
            (.source.sha256 | length == 64) and
            (.submodules | length == 3) and
            all(.submodules[]; (.sha256 | length == 64))
          ' third_party/freecad/source.lock.json
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("third_party/freecad/branding.xml").getroot()
          assert root.tag == "Branding" and root.attrib["version"] == "1.0"
          PY
      - name: Validate pinned Hunyuan3D-Omni metadata
        run: |
          jq -e '
            .commit == "4d47c0cc2bd0c4281963a7314ab330a5af36bfa8" and
            .sha256 == "1191700188114ac9fd257ed617c3a46bb523adc90a05316c2bbed433063e32d3" and
            (.rocm_base | startswith("rocm/pytorch:"))
          ' cloud/hunyuan-omni-amd/source.lock.json
          if grep -E 'cupy-cuda|nvidia-|\+cu[0-9]+' cloud/hunyuan-omni-amd/requirements.lock.txt; then
            echo "CUDA-only dependency leaked into ROCm lock" >&2
            exit 1
          fi

  supported-baseline-linux:
    name: Supported Qt application + C++ + Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements-ci.lock.txt
      - name: Install Qt and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libqt6opengl6-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-qpa-plugins
      - name: Run the clean-checkout baseline gate
        env:
          DS_WORK_ROOT: ${{ runner.temp }}/designstudio-baseline
        run: ./build-linux.sh

  core-windows:
    name: C++ core portability (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure outside the checkout
        run: cmake -B "$env:RUNNER_TEMP/core-build" -S core
      - name: Build
        run: cmake --build "$env:RUNNER_TEMP/core-build" --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir "$env:RUNNER_TEMP/core-build" -C Release --output-on-failure
