services:
  vllm:
    # Compose replaces, rather than appends, the service command. Keep this
    # override beside the pinned base file so APC-off comparisons cannot drift
    # in model, revision, memory, or context length.
    command:
      - --model
      - ${DS_AI_MODEL:-Qwen/Qwen3.5-35B-A3B}
      - --revision
      - ${DS_AI_MODEL_REVISION:?Set DS_AI_MODEL_REVISION to an immutable commit}
      - --served-model-name
      - ${DS_AI_MODEL:-Qwen/Qwen3.5-35B-A3B}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - ${DS_VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      - --max-model-len
      - "65536"
